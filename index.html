const generateId = () => `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;

const fmt = (n) => {
  if (isNaN(n)) return "0";
  return Math.round(n).toLocaleString("en-IN");
};

// Sort activities by time string "HH:MM"
const sortActivities = (acts) =>
  [...acts].sort((a, b) => (a.time || "").localeCompare(b.time || ""));

// Calculate balances and settlement suggestions
const calculateExpenseSummary = (expenses, members) => {
  const memberNames = members.map(m => m.name);
  let totalSpent = 0;
  const paidByUser = {};
  const sharePerUser = {};
  memberNames.forEach(name => { paidByUser[name] = 0; sharePerUser[name] = 0; });

  (expenses || []).forEach(exp => {
    const amount = parseFloat(exp.amount) || 0;
    totalSpent += amount;
    paidByUser[exp.paidBy] = (paidByUser[exp.paidBy] || 0) + amount;
    const among = exp.splitAmong && exp.splitAmong.length > 0 ? exp.splitAmong : memberNames;
    const perPersonShare = amount / among.length;
    among.forEach(person => {
      sharePerUser[person] = (sharePerUser[person] || 0) + perPersonShare;
    });
  });

  // balance > 0 means person is owed money; < 0 means person owes money
  const balance = {};
  memberNames.forEach(name => {
    balance[name] = (paidByUser[name] || 0) - (sharePerUser[name] || 0);
  });

  // Build settlement suggestions: who pays whom
  const settlements = [];
  const debtors = memberNames
    .filter(n => balance[n] < -0.01)
    .map(n => ({ name: n, amount: -balance[n] }))
    .sort((a, b) => b.amount - a.amount);
  const creditors = memberNames
    .filter(n => balance[n] > 0.01)
    .map(n => ({ name: n, amount: balance[n] }))
    .sort((a, b) => b.amount - a.amount);

  let di = 0, ci = 0;
  while (di < debtors.length && ci < creditors.length) {
    const pay = Math.min(debtors[di].amount, creditors[ci].amount);
    if (pay > 0.01) {
      settlements.push({
        from: debtors[di].name,
        to: creditors[ci].name,
        amount: pay
      });
    }
    debtors[di].amount -= pay;
    creditors[ci].amount -= pay;
    if (debtors[di].amount < 0.01) di++;
    if (creditors[ci].amount < 0.01) ci++;
  }

  return {
    totalSpent,
    avgPerPerson: memberNames.length > 0 ? totalSpent / memberNames.length : 0,
    paidByUser,
    sharePerUser,
    balance,
    settlements
  };
};

            <input type="text" value={username} onChange={e => setUsername(e.target.value)} placeholder="Enter username" style={{width:"100%"}} />
          </div>
          <div style={{marginBottom:"20px"}}>
            <label style={{display:"block",color:"#cbd5e1",fontSize:"14px",marginBottom:"6px"}}>Password</label>
            <input type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="Enter password" style={{width:"100%"}} />
          </div>
          {error && <div style={{marginBottom:"16px",color:"#ef4444",fontSize:"14px",textAlign:"center"}}>{error}</div>}

// ========== EDIT MODAL (generic) ==========
const EditModal = ({ title, fields, values, onChange, onSave, onClose }) => (
  <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.8)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:50,padding:"16px"}} onClick={onClose}>
    <div style={{background:"#1e293b",borderRadius:"16px",maxWidth:"500px",width:"100%",maxHeight:"90vh",overflow:"auto"}} onClick={e => e.stopPropagation()}>
      <div style={{padding:"16px",borderBottom:"1px solid #334155",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <h3 style={{fontWeight:"bold"}}>{title}</h3>
        <button onClick={onClose} style={{background:"none",border:"none",color:"white",fontSize:"24px",lineHeight:1}}>&times;</button>
      </div>
      <div style={{padding:"16px",display:"flex",flexDirection:"column",gap:"12px"}}>
        {fields.map(f => {
          if (f.type === "select") return (
            <div key={f.key}>
              {f.label && <label style={{display:"block",color:"#cbd5e1",fontSize:"13px",marginBottom:"4px"}}>{f.label}</label>}
              <select value={values[f.key] || ""} onChange={e => onChange(f.key, e.target.value)} style={{width:"100%"}}>
                {(f.options || []).map(opt => <option key={opt.value || opt} value={opt.value || opt}>{opt.label || opt}</option>)}
              </select>
            </div>
          );
          if (f.type === "checkboxGroup") return (
            <div key={f.key}>
              <label style={{display:"block",color:"#cbd5e1",fontSize:"13px",marginBottom:"6px"}}>{f.label}</label>
              <div style={{display:"flex",flexWrap:"wrap",gap:"8px"}}>
                {(f.options || []).map(opt => (
                  <label key={opt} style={{display:"flex",alignItems:"center",gap:"6px",cursor:"pointer"}}>
                    <input type="checkbox"
                      checked={(values[f.key] || []).includes(opt)}
                      onChange={e => {
                        const arr = values[f.key] || [];
                        onChange(f.key, e.target.checked ? [...arr, opt] : arr.filter(x => x !== opt));
                      }}
                    />
                    <span style={{fontSize:"14px"}}>{opt}</span>
                  </label>
                ))}
              </div>
            </div>
          );
          return (
            <div key={f.key}>
              {f.label && <label style={{display:"block",color:"#cbd5e1",fontSize:"13px",marginBottom:"4px"}}>{f.label}</label>}
              <input
                type={f.inputType || "text"}
                placeholder={f.placeholder || f.label || ""}
                value={values[f.key] || ""}
                onChange={e => onChange(f.key, e.target.value)}
                style={{width:"100%"}}
              />
            </div>
          );
        })}
        <button onClick={onSave} style={{padding:"12px",background:"#3b82f6",border:"none",borderRadius:"8px",color:"white",fontWeight:"600",marginTop:"4px"}}>
          Save
        </button>

);

// ========== MAIN APP ==========
const App = () => {
  const [authUser, setAuthUser] = React.useState(null);
  const [tripData, setTripData] = React.useState(null);
  const [loading,  setLoading]  = React.useState(true);
  const [activeTab, setActiveTab] = React.useState("dashboard");
  const [activeDay, setActiveDay] = React.useState(1);
  const [isSyncing, setIsSyncing] = React.useState(false);

  // Modal / edit states
  const [modal, setModal] = React.useState(null); // { type, data }
  const [editForm, setEditForm] = React.useState({});

  // ---- Default data ----
  const getDefaultTripData = () => ({
    members: [
      { id: "m1", name: "Sanjug",  isAdmin: true  },
      { id: "m2", name: "Manishk", isAdmin: false },
      { id: "m3", name: "Atikab",  isAdmin: false }
    ],
    itinerary: DAYS.map(day => ({
      dayId: day.id,
      date: day.date,
      activities: sortActivities([
        { id: generateId(), time: "09:00", title: "Breakfast",         location: "Hotel",             notes: "" },
        { id: generateId(), time: "11:00", title: "Visit local market",location: "City Center",       notes: "" },
        { id: generateId(), time: "15:00", title: "Lunch",             location: "Local Restaurant",  notes: "" },
        { id: generateId(), time: "18:00", title: "Sunset point",      location: "Viewpoint",         notes: "" }
      ])
    })),
    packingList: [
      { id: generateId(), category:"Clothing",    item:"T-shirts (3)",       checked:false, assignedTo:null },
      { id: generateId(), category:"Clothing",    item:"Jeans/Shorts",       checked:false, assignedTo:null },
      { id: generateId(), category:"Clothing",    item:"Jacket/Sweater",     checked:false, assignedTo:null },
      { id: generateId(), category:"Clothing",    item:"Underwear & Socks",  checked:false, assignedTo:null },
      { id: generateId(), category:"Toiletries",  item:"Toothbrush & Paste", checked:false, assignedTo:null },
      { id: generateId(), category:"Toiletries",  item:"Shampoo & Soap",     checked:false, assignedTo:null },
      { id: generateId(), category:"Toiletries",  item:"Sunscreen",          checked:false, assignedTo:null },
      { id: generateId(), category:"Electronics", item:"Phone charger",      checked:false, assignedTo:null },
      { id: generateId(), category:"Electronics", item:"Power bank",         checked:false, assignedTo:null },
      { id: generateId(), category:"Documents",   item:"ID proof",           checked:false, assignedTo:null },
      { id: generateId(), category:"Misc",        item:"First aid kit",      checked:false, assignedTo:null },
      { id: generateId(), category:"Misc",        item:"Snacks",             checked:false, assignedTo:null }
    ],
    expenses: [
      { id:generateId(), date:DAYS[0].date, description:"Hotel booking", amount:15000, paidBy:"Sanjug",  splitAmong:["Sanjug","Manishk","Atikab"] },
      { id:generateId(), date:DAYS[0].date, description:"Dinner",        amount:2400,  paidBy:"Manishk", splitAmong:["Sanjug","Manishk","Atikab"] },
      { id:generateId(), date:DAYS[1].date, description:"Taxi fare",     amount:1200,  paidBy:"Atikab",  splitAmong:["Sanjug","Manishk","Atikab"] }
    ],
    polls: [
      { id:generateId(), question:"Where should we have dinner on Day 2?", options:["Indian restaurant","Italian place","Street food"], votes:{"Indian restaurant":2,"Italian place":1,"Street food":0}, createdBy:"Sanjug" }
    ]
  });

  // ---- One-time load on mount ----
  React.useEffect(() => {
    const savedAuth = localStorage.getItem("trip_auth");
    if (savedAuth) {
      const user = JSON.parse(savedAuth);
      setAuthUser(user);
      // Data will be loaded by the authUser effect below
    } else {
      setLoading(false);
    }
  }, []);

  // ---- Load + subscribe when authUser is set ----
  React.useEffect(() => {
    if (!authUser) return;

    const docRef = db.collection("trips").doc(TRIP_ID);
    let unsubscribe = null;

    const init = async () => {
      try {
        const doc = await docRef.get();
        if (!doc.exists) {
          const defaultData = getDefaultTripData();
          await docRef.set(defaultData);
        }
      } catch (err) {
        console.error("Init error:", err);
      } finally {
        // Now subscribe for real-time updates
        unsubscribe = docRef.onSnapshot(snap => {
          if (snap.exists) setTripData(snap.data());
          setLoading(false);
        }, err => {
          console.error("Snapshot error:", err);
          setLoading(false);
        });
      }
    };

    init();
    return () => unsubscribe && unsubscribe();
  }, [authUser]);

  // ---- Write helper ----
  const updateTripData = async (newData) => {
    setIsSyncing(true);
    try {
      await db.collection("trips").doc(TRIP_ID).set(newData);
      // onSnapshot will update state
    } catch (err) {
      console.error("Update error:", err);
      alert("Failed to save. Please check your connection.");
    } finally {
      setIsSyncing(false);
    }
  };

  // ---- Auth ----
  const handleLogout = () => {
    localStorage.removeItem("trip_auth");
    setAuthUser(null);
    setTripData(null);
    setLoading(false);
  };

  // ---- Loading / auth guards ----
  if (loading) {
    return (
      <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#0f172a,#1e1b4b)",display:"flex",alignItems:"center",justifyContent:"center"}}>
        <div className="loading-spinner" style={{width:"40px",height:"40px"}}></div>
      </div>
    );
  }

  if (!authUser) return <LoginPage onLogin={user => { setAuthUser(user); setLoading(true); }} />;

  if (!tripData) {
    return (
      <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#0f172a,#1e1b4b)",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:"12px"}}>
        <div className="loading-spinner" style={{width:"40px",height:"40px"}}></div>
        <div style={{color:"#94a3b8",fontSize:"14px"}}>Loading trip data…</div>
      </div>
    );
  }

  // ---- Derived ----
  const isAdmin = authUser.role === "admin";
  const memberNames = (tripData.members || []).map(m => m.name);
  const expenseSummary = calculateExpenseSummary(tripData.expenses || [], tripData.members || []);
  const currentDay = DAYS.find(d => d.id === activeDay);

  // ---- Open modal helpers ----
  const openModal = (type, initialData = {}) => {
    setEditForm(initialData);
    setModal({ type });
  };
  const closeModal = () => { setModal(null); setEditForm({}); };
  const setField = (key, val) => setEditForm(prev => ({ ...prev, [key]: val }));

  // =========================================================
  // ADD / EDIT / DELETE ACTIONS
  // =========================================================

  // --- Expenses ---
  const saveExpense = () => {
    const { _editId, date, description, amount, paidBy, splitAmong } = editForm;
    if (!description || !amount || !paidBy || !splitAmong || splitAmong.length === 0) {
      alert("Please fill all fields and select at least one person to split among.");
      return;
    }
    const record = { id: _editId || generateId(), date: date || DAYS[0].date, description, amount: parseFloat(amount), paidBy, splitAmong };
    const expenses = _editId
      ? (tripData.expenses || []).map(e => e.id === _editId ? record : e)
      : [...(tripData.expenses || []), record];
    updateTripData({ ...tripData, expenses });
    closeModal();
  };

  const deleteExpense = id => updateTripData({ ...tripData, expenses: tripData.expenses.filter(e => e.id !== id) });

  // --- Activities ---
  const saveActivity = () => {
    const { _editId, _dayId, time, title, location, notes } = editForm;
    if (!title) { alert("Please enter activity title"); return; }
    const dayId = _dayId;
    const record = { id: _editId || generateId(), time: time || "12:00", title, location: location || "", notes: notes || "" };
    const updatedItinerary = (tripData.itinerary || []).map(d =>
      d.dayId === dayId
        ? { ...d, activities: sortActivities(_editId ? d.activities.map(a => a.id === _editId ? record : a) : [...d.activities, record]) }
        : d
    );
    updateTripData({ ...tripData, itinerary: updatedItinerary });
    closeModal();
  };

  const deleteActivity = (dayId, actId) => {
    const updatedItinerary = (tripData.itinerary || []).map(d =>
      d.dayId === dayId ? { ...d, activities: d.activities.filter(a => a.id !== actId) } : d
    );
    updateTripData({ ...tripData, itinerary: updatedItinerary });
  };

  // --- Packing ---
  const savePackingItem = () => {
    const { _editId, category, item } = editForm;
    if (!item) { alert("Please enter item name"); return; }
    const record = _editId
      ? { ...(tripData.packingList || []).find(i => i.id === _editId), category, item }
      : { id: generateId(), category: category || "Clothing", item, checked: false, assignedTo: null };
    const packingList = _editId
      ? (tripData.packingList || []).map(i => i.id === _editId ? record : i)
      : [...(tripData.packingList || []), record];
    updateTripData({ ...tripData, packingList });
    closeModal();
  };

  const deletePackingItem = id => updateTripData({ ...tripData, packingList: (tripData.packingList || []).filter(i => i.id !== id) });
  const togglePackingItem = id => {
    const updated = (tripData.packingList || []).map(i => i.id === id ? { ...i, checked: !i.checked } : i);
    updateTripData({ ...tripData, packingList: updated });
  };

  // --- Polls ---
  const savePoll = () => {
    const { question, options } = editForm;
    const cleanOpts = (options || []).filter(o => o.trim());
    if (!question || cleanOpts.length < 2) { alert("Enter a question and at least 2 options"); return; }
    const votes = {};
    cleanOpts.forEach(o => { votes[o] = 0; });
    const poll = { id: generateId(), question, options: cleanOpts, votes, createdBy: authUser.username };
    updateTripData({ ...tripData, polls: [...(tripData.polls || []), poll] });
    closeModal();
  };

  const deletePoll = id => updateTripData({ ...tripData, polls: (tripData.polls || []).filter(p => p.id !== id) });
  const votePoll = (pollId, option) => {
    const updated = (tripData.polls || []).map(p =>
      p.id === pollId ? { ...p, votes: { ...p.votes, [option]: (p.votes[option] || 0) + 1 } } : p
    );
    updateTripData({ ...tripData, polls: updated });
  };

  // --- Members ---
  const saveMember = () => {
    const { name } = editForm;
    if (!name || !name.trim()) { alert("Please enter member name"); return; }
    if ((tripData.members || []).length >= 10) { alert("Maximum 10 members allowed"); return; }
    updateTripData({ ...tripData, members: [...(tripData.members || []), { id: generateId(), name: name.trim(), isAdmin: false }] });
    closeModal();
  };

  const deleteMember = id => {
    if ((tripData.members || []).length <= 1) { alert("At least one member required"); return; }
    updateTripData({ ...tripData, members: (tripData.members || []).filter(m => m.id !== id) });
  };

  const resetToDefault = () => {
    if (window.confirm("Reset ALL trip data to defaults? This cannot be undone.")) updateTripData(getDefaultTripData());
  };

  // =========================================================
  // RENDER TABS
  // =========================================================

  const SyncBanner = () => isSyncing ? (
    <div style={{textAlign:"center",fontSize:"12px",color:"#3b82f6",padding:"4px",background:"rgba(59,130,246,0.1)",borderRadius:"6px",marginBottom:"8px"}}>
      ⏳ Syncing changes…
    </div>
  ) : null;

  // ---- DASHBOARD ----
  const renderDashboard = () => {
    const packedItems = (tripData.packingList || []).filter(i => i.checked).length;
    const totalItems  = (tripData.packingList || []).length;
    const upcomingActs = (tripData.itinerary || [])
      .flatMap(d => (d.activities || []).map(a => ({ ...a, dayId: d.dayId })))
      .slice(0, 6);

    return (
      <div style={{display:"flex",flexDirection:"column",gap:"20px"}}>
        <SyncBanner />
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:"12px"}}>
          {[
            { label:"Members",    value: tripData.members?.length || 0,       color:"#3b82f6" },
            { label:"Total Spent",value:`₹${fmt(expenseSummary.totalSpent)}`, color:"#10b981" },
            { label:"Avg/Person", value:`₹${fmt(expenseSummary.avgPerPerson)}`,color:"#f59e0b" },
            { label:"Packed",     value:`${packedItems}/${totalItems}`,        color:"#a78bfa" }
          ].map(c => (
            <div key={c.label} style={{background:"#1e293b",borderRadius:"12px",padding:"16px",textAlign:"center",border:"1px solid #334155"}}>

    const total = (tripData.packingList || []).length;

    return (
      <div style={{display:"flex",flexDirection:"column",gap:"16px"}}>

            <div style={{width:`${pct}%`,height:"100%",background:"linear-gradient(90deg,#3b82f6,#a78bfa)",borderRadius:"10px",transition:"width 0.3s"}}></div>

                    <span style={{flex:1, textDecoration:item.checked?"line-through":"none", color:item.checked?"#64748b":"white"}}>

              <span style={{color: bal > 0.01 ? "#10b981" : bal < -0.01 ? "#ef4444" : "#94a3b8", fontWeight:"600"}}>

              </span>
            </div>
          );
        })}
      </div>

      {/* Settlement suggestions */}
      {expenseSummary.settlements.length > 0 && (

                {isAdmin && <button onClick={() => deleteExpense(exp.id)}
                  style={{background:"none",border:"none",color:"#ef4444",fontSize:"12px",cursor:"pointer",padding:"3px 6px"}}>🗑️</button>}
              </div>
            </div>
          </div>
        </div>
      ))}
    </div>

  // ---- POLLS ----
  const renderPolls = () => (
    <div style={{display:"flex",flexDirection:"column",gap:"16px"}}>
      <SyncBanner />
      {isAdmin && (
        <button onClick={() => openModal("poll", { question:"", options:["",""] })}
          style={{padding:"10px",background:"#3b82f6",border:"none",borderRadius:"8px",color:"white",fontWeight:"500"}}>
          + Create Poll
        </button>
      )}
      {(!tripData.polls || tripData.polls.length === 0)
        ? <div style={{textAlign:"center",padding:"40px",color:"#64748b"}}>No polls yet</div>
        : (tripData.polls || []).map(poll => {
          const total = Object.values(poll.votes || {}).reduce((a,b) => a+b, 0);
          const winner = (poll.options || []).reduce((best, opt) =>
            (poll.votes?.[opt] || 0) > (poll.votes?.[best] || 0) ? opt : best
          , poll.options?.[0] || "");
          return (
            <div key={poll.id} style={{background:"#1e293b",borderRadius:"12px",padding:"16px",border:"1px solid #334155"}}>
              <h3 style={{fontWeight:"600",marginBottom:"12px"}}>{poll.question}</h3>
              {(poll.options || []).map(opt => {
                const votes = poll.votes?.[opt] || 0;
                const pct = total > 0 ? (votes / total) * 100 : 0;
                const isWinning = opt === winner && total > 0;
                return (
                  <div key={opt} style={{marginBottom:"12px"}}>
                    <div style={{display:"flex",justifyContent:"space-between",fontSize:"14px",marginBottom:"4px"}}>
                      <span style={{color: isWinning ? "#10b981" : "inherit", fontWeight: isWinning ? "600" : "normal"}}>
                        {isWinning && "🏆 "}{opt}
                      </span>
                      <span style={{color:"#94a3b8"}}>{votes} vote{votes !== 1 ? "s" : ""} ({Math.round(pct)}%)</span>
                    </div>
                    <div style={{background:"#334155",borderRadius:"10px",height:"8px",overflow:"hidden",marginBottom:"6px"}}>
                      <div style={{width:`${pct}%`,height:"100%",background: isWinning ? "#10b981" : "#3b82f6",borderRadius:"10px",transition:"width 0.3s"}}></div>
                    </div>
                    <button onClick={() => votePoll(poll.id, opt)}
                      style={{padding:"4px 12px",background:"#0f172a",border:"1px solid #334155",borderRadius:"6px",color:"white",fontSize:"12px",cursor:"pointer"}}>
                      Vote
                    </button>
                  </div>
                );
              })}
              <div style={{fontSize:"11px",color:"#64748b",marginTop:"8px"}}>Created by {poll.createdBy} • {total} total vote{total !== 1 ? "s" : ""}</div>

                <button onClick={() => deletePoll(poll.id)}
                  style={{marginTop:"8px",background:"none",border:"none",color:"#ef4444",fontSize:"12px",cursor:"pointer"}}>
                  🗑️ Delete Poll
                </button>
              )}
            </div>
          );
        })
      }
    </div>

    <div style={{display:"flex",flexDirection:"column",gap:"16px"}}>

      {isAdmin && (
        <button onClick={() => openModal("member", { name:"" })}
          style={{padding:"10px",background:"#3b82f6",border:"none",borderRadius:"8px",color:"white",fontWeight:"500"}}>
          + Add Member
        </button>
      )}
      {(tripData.members || []).map(m => (
        <div key={m.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:"#1e293b",borderRadius:"12px",padding:"16px",border:"1px solid #334155"}}>
          <div>
            <span style={{fontWeight:"500"}}>{m.name}</span>
            {m.isAdmin && <span style={{marginLeft:"8px",fontSize:"11px",color:"#f59e0b",background:"rgba(245,158,11,0.1)",padding:"2px 6px",borderRadius:"4px"}}>Admin</span>}

            <span style={{fontSize:"12px",color: expenseSummary.balance[m.name] > 0.01 ? "#10b981" : expenseSummary.balance[m.name] < -0.01 ? "#ef4444" : "#64748b"}}>

          <div>Total expenses: <strong style={{color:"white"}}>{tripData.expenses?.length}</strong></div>
          <div>Packing items: <strong style={{color:"white"}}>{tripData.packingList?.length}</strong></div>
          <div>Polls: <strong style={{color:"white"}}>{tripData.polls?.length}</strong></div>

            { key:"title",    label:"Activity Title", placeholder:"e.g. Breakfast" },
            { key:"location", label:"Location", placeholder:"e.g. Hotel" },
            { key:"notes",    label:"Notes (optional)", placeholder:"Any details..." }
          ]}
        />
      );
    }

    if (modal.type === "packing") {
      return (
        <EditModal
          title={editForm._editId ? "Edit Packing Item" : "Add Packing Item"}
          onClose={closeModal}
          onSave={savePackingItem}
          values={editForm}
          onChange={setField}
          fields={[
            { key:"category", label:"Category", type:"select", options: PACKING_CATEGORIES },
            { key:"item",     label:"Item Name", placeholder:"e.g. Sunscreen" }
          ]}
        />
      );
    }

    if (modal.type === "poll") {
      return (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.8)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:50,padding:"16px"}} onClick={closeModal}>
          <div style={{background:"#1e293b",borderRadius:"16px",maxWidth:"500px",width:"100%",maxHeight:"90vh",overflow:"auto"}} onClick={e => e.stopPropagation()}>
            <div style={{padding:"16px",borderBottom:"1px solid #334155",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <h3 style={{fontWeight:"bold"}}>Create Poll</h3>
              <button onClick={closeModal} style={{background:"none",border:"none",color:"white",fontSize:"24px",lineHeight:1}}>&times;</button>
            </div>
            <div style={{padding:"16px",display:"flex",flexDirection:"column",gap:"12px"}}>
              <div>
                <label style={{display:"block",color:"#cbd5e1",fontSize:"13px",marginBottom:"4px"}}>Question</label>
                <input type="text" placeholder="e.g. Where should we have dinner?" value={editForm.question||""} onChange={e => setField("question", e.target.value)} style={{width:"100%"}} />
              </div>
              <label style={{color:"#cbd5e1",fontSize:"13px"}}>Options</label>
              {(editForm.options||[]).map((opt, idx) => (
                <div key={idx} style={{display:"flex",gap:"8px"}}>
                  <input type="text" placeholder={`Option ${idx+1}`} value={opt}
                    onChange={e => {
                      const opts = [...(editForm.options||[])];
                      opts[idx] = e.target.value;
                      setField("options", opts);
                    }}
                    style={{flex:1}}
                  />
                  {idx >= 2 && (
                    <button onClick={() => setField("options", (editForm.options||[]).filter((_,i)=>i!==idx))}
                      style={{background:"#ef4444",border:"none",borderRadius:"6px",color:"white",padding:"0 10px",cursor:"pointer"}}>×</button>
                  )}
                </div>
              ))}
              <button onClick={() => setField("options", [...(editForm.options||[]), ""])}
                style={{padding:"8px",background:"#475569",border:"none",borderRadius:"6px",color:"white",cursor:"pointer"}}>
                + Add Option
              </button>
              <button onClick={savePoll}
                style={{padding:"12px",background:"#3b82f6",border:"none",borderRadius:"8px",color:"white",fontWeight:"600"}}>
                Create Poll
              </button>
            </div>
          </div>
        </div>
      );
    }

    if (modal.type === "member") {
      return (
        <EditModal
          title="Add Member"
          onClose={closeModal}
          onSave={saveMember}
          values={editForm}
          onChange={setField}
          fields={[{ key:"name", label:"Member Name", placeholder:"e.g. Rahul" }]}
        />
      );
    }

    return null;
  };

  // =========================================================
  // TABS + LAYOUT
  // =========================================================
  const tabs = [
    { id:"dashboard", label:"🏠 Home",      render: renderDashboard },
    { id:"itinerary", label:"📅 Itinerary", render: renderItinerary },
    { id:"packing",   label:"🎒 Packing",   render: renderPacking   },
    { id:"expenses",  label:"💰 Expenses",  render: renderExpenses  },
    { id:"polls",     label:"📊 Polls",     render: renderPolls     },
    { id:"members",   label:"👥 Members",   render: renderMembers   },
    { id:"settings",  label:"⚙️ Settings",  render: renderSettings  }
  ];

  return (
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#0f172a,#1e1b4b)"}}>
      {/* Header */}
      <div style={{position:"sticky",top:0,zIndex:10,background:"rgba(15,23,42,0.95)",backdropFilter:"blur(10px)",borderBottom:"1px solid #334155",padding:"10px 16px"}}>
        <div style={{display:"flex",flexWrap:"wrap",justifyContent:"space-between",alignItems:"center",gap:"8px",maxWidth:"1200px",margin:"0 auto"}}>
          <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
            <div style={{fontSize:"26px"}}>✈️</div>
            <div>
              <h1 style={{fontWeight:"bold",fontSize:"17px",color:"white",lineHeight:"1.2"}}>Trip Planner</h1>
              <div style={{fontSize:"11px",color:"#94a3b8"}}>
                {authUser.username}{isAdmin ? " (Admin)" : ""} • Live Sync {isSyncing ? "⏳" : "✅"}
              </div>
            </div>
          </div>
          <div style={{display:"flex",gap:"4px",overflowX:"auto",paddingBottom:"2px"}}>
            {tabs.map(tab => (
              <button key={tab.id} onClick={() => setActiveTab(tab.id)}
                style={{padding:"6px 12px",borderRadius:"8px",fontSize:"13px",whiteSpace:"nowrap",border:"none",background: activeTab===tab.id?"#3b82f6":"transparent",color: activeTab===tab.id?"white":"#94a3b8",cursor:"pointer",fontWeight: activeTab===tab.id?"600":"normal"}}>
                {tab.label}
              </button>
            ))}
          </div>
        </div>
      </div>

      {/* Content */}
      <div style={{padding:"20px 16px",maxWidth:"1200px",margin:"0 auto"}}>
        {tabs.find(t => t.id === activeTab)?.render()}
      </div>

      {/* Modal */}
      {renderModal()}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
