const EXPENSE_CATEGORIES   = ["Food","Transport","Stay","Activities","Shopping","Misc"];
const BOOKING_TYPES        = ["Flight","Hotel","Train","Cab","Activity","Other"];
const BOOKING_STATUSES     = ["confirmed","pending","cancelled"];
const CURRENCIES           = ["INR","USD","EUR","GBP","JPY","AED","SGD","THB","MYR","AUD","CAD"];
const CURRENCY_SYMBOLS     = {INR:"₹",USD:"$",EUR:"€",GBP:"£",JPY:"¥",AED:"د.إ",SGD:"S$",THB:"฿",MYR:"RM",AUD:"A$",CAD:"C$"};
const TASK_STATUSES        = ["pending","in-progress","done"];

// ========== HELPERS ==========
const generateId = () => `${Date.now()}-${Math.random().toString(36).slice(2,8)}`;
const fmt  = n => isNaN(n) ? "0" : Math.round(n).toLocaleString("en-IN");
const fmtD = n => isNaN(n) ? "0.00" : Number(n).toFixed(2);

const sortActivities = acts => [...acts].sort((a,b)=>(a.time||"").localeCompare(b.time||""));

const calculateExpenseSummary = (expenses, members) => {
  const memberNames = members.map(m=>m.name);
  let totalSpent=0;
  const paidByUser={}, sharePerUser={};
  memberNames.forEach(n=>{ paidByUser[n]=0; sharePerUser[n]=0; });
  const byCategory={};
  EXPENSE_CATEGORIES.forEach(c=>{ byCategory[c]=0; });

  (expenses||[]).forEach(exp=>{
    const amount = parseFloat(exp.amount)||0;
    totalSpent += amount;
    paidByUser[exp.paidBy] = (paidByUser[exp.paidBy]||0)+amount;
    const among = exp.splitAmong?.length>0 ? exp.splitAmong : memberNames;
    const share = amount/among.length;
    among.forEach(p=>{ sharePerUser[p]=(sharePerUser[p]||0)+share; });
    const cat = exp.category||"Misc";
    byCategory[cat]=(byCategory[cat]||0)+amount;
  });

  const balance={};
  memberNames.forEach(n=>{ balance[n]=(paidByUser[n]||0)-(sharePerUser[n]||0); });

  const settlements=[];
  const debtors  = memberNames.filter(n=>balance[n]<-0.01).map(n=>({name:n,amount:-balance[n]})).sort((a,b)=>b.amount-a.amount);
  const creditors = memberNames.filter(n=>balance[n]>0.01).map(n=>({name:n,amount:balance[n]})).sort((a,b)=>b.amount-a.amount);
  let di=0,ci=0;
  while(di<debtors.length&&ci<creditors.length){
    const pay=Math.min(debtors[di].amount,creditors[ci].amount);
    if(pay>0.01) settlements.push({from:debtors[di].name,to:creditors[ci].name,amount:pay});
    debtors[di].amount-=pay; creditors[ci].amount-=pay;
    if(debtors[di].amount<0.01) di++;
    if(creditors[ci].amount<0.01) ci++;
  }
  return {totalSpent, avgPerPerson:memberNames.length>0?totalSpent/memberNames.length:0, paidByUser, sharePerUser, balance, settlements, byCategory};
};

// ========== LOGIN PAGE ==========

    else setError("Invalid username or password");

  return (

          <div style={{marginBottom:"20px"}}><label style={{display:"block",color:"#cbd5e1",fontSize:"14px",marginBottom:"6px"}}>Password</label><input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="Enter password" style={{width:"100%"}} /></div>
          {error&&<div style={{marginBottom:"16px",color:"#ef4444",fontSize:"14px",textAlign:"center"}}>{error}</div>}
          <button type="submit" disabled={loading} style={{width:"100%",padding:"12px",background:"#3b82f6",border:"none",borderRadius:"8px",color:"white",fontWeight:"600",fontSize:"16px",opacity:loading?0.7:1}}>{loading?"Loading...":"Sign In"}</button>

};

            <div key={f.key}>{f.label&&<label style={{display:"block",color:"#cbd5e1",fontSize:"13px",marginBottom:"4px"}}>{f.label}</label>}
              <input type="date" value={values[f.key]||""} onChange={e=>onChange(f.key,e.target.value)} style={{width:"100%"}} />

            <div key={f.key}>{f.label&&<label style={{display:"block",color:"#cbd5e1",fontSize:"13px",marginBottom:"4px"}}>{f.label}</label>}
              <input type={f.inputType||"text"} placeholder={f.placeholder||f.label||""} value={values[f.key]||""} onChange={e=>onChange(f.key,e.target.value)} style={{width:"100%"}} />
            </div>
          );
        })}
        <button onClick={onSave} style={{padding:"12px",background:"#3b82f6",border:"none",borderRadius:"8px",color:"white",fontWeight:"600",marginTop:"4px"}}>Save</button>

);

// ========== MAIN APP ==========
const App = () => {
  // ---- existing state ----
  const [authUser,setAuthUser]   = React.useState(null);
  const [tripData,setTripData]   = React.useState(null);
  const [loading,setLoading]     = React.useState(true);
  const [activeTab,setActiveTab] = React.useState("dashboard");
  const [activeDay,setActiveDay] = React.useState(1);
  const [modal,setModal]         = React.useState(null);
  const [editForm,setEditForm]   = React.useState({});
  const [isSyncing,setIsSyncing] = React.useState(false);

  // ---- new state ----
  const [exchangeRate,setExchangeRate]       = React.useState(1);
  const [weather,setWeather]                 = React.useState(null);
  const [weatherLoading,setWeatherLoading]   = React.useState(false);
  const [showReminders,setShowReminders]     = React.useState(false);
  const [docSection,setDocSection]           = React.useState("passports");
  const [taskFilter,setTaskFilter]           = React.useState("all");
  const [bookingFilter,setBookingFilter]     = React.useState("all");
  const [budgetEditMode,setBudgetEditMode]   = React.useState(false);
  const [budgetDraft,setBudgetDraft]         = React.useState({});

  // ---- default data (with new fields) ----
  const getDefaultTripData = () => ({
    members:[
      {id:"m1",name:"Sanjug",isAdmin:true},
      {id:"m2",name:"Manishk",isAdmin:false},
      {id:"m3",name:"Atikab",isAdmin:false}
    ],
    itinerary:DAYS.map(day=>({
      dayId:day.id, date:day.date,
      activities:sortActivities([
        {id:generateId(),time:"09:00",title:"Breakfast",location:"Hotel",notes:""},
        {id:generateId(),time:"11:00",title:"Visit local market",location:"City Center",notes:""},
        {id:generateId(),time:"15:00",title:"Lunch",location:"Local Restaurant",notes:""},
        {id:generateId(),time:"18:00",title:"Sunset point",location:"Viewpoint",notes:""}
      ])
    })),
    packingList:[
      {id:generateId(),category:"Clothing",item:"T-shirts (3)",checked:false,assignedTo:null},
      {id:generateId(),category:"Clothing",item:"Jeans/Shorts",checked:false,assignedTo:null},
      {id:generateId(),category:"Clothing",item:"Jacket/Sweater",checked:false,assignedTo:null},
      {id:generateId(),category:"Clothing",item:"Underwear & Socks",checked:false,assignedTo:null},
      {id:generateId(),category:"Toiletries",item:"Toothbrush & Paste",checked:false,assignedTo:null},
      {id:generateId(),category:"Toiletries",item:"Shampoo & Soap",checked:false,assignedTo:null},
      {id:generateId(),category:"Toiletries",item:"Sunscreen",checked:false,assignedTo:null},
      {id:generateId(),category:"Electronics",item:"Phone charger",checked:false,assignedTo:null},
      {id:generateId(),category:"Electronics",item:"Power bank",checked:false,assignedTo:null},
      {id:generateId(),category:"Documents",item:"ID proof",checked:false,assignedTo:null},
      {id:generateId(),category:"Misc",item:"First aid kit",checked:false,assignedTo:null},
      {id:generateId(),category:"Misc",item:"Snacks",checked:false,assignedTo:null}
    ],
    expenses:[
      {id:generateId(),date:DAYS[0].date,description:"Hotel booking",amount:15000,paidBy:"Sanjug",splitAmong:["Sanjug","Manishk","Atikab"],category:"Stay"},
      {id:generateId(),date:DAYS[0].date,description:"Dinner",amount:2400,paidBy:"Manishk",splitAmong:["Sanjug","Manishk","Atikab"],category:"Food"},
      {id:generateId(),date:DAYS[1].date,description:"Taxi fare",amount:1200,paidBy:"Atikab",splitAmong:["Sanjug","Manishk","Atikab"],category:"Transport"}
    ],
    polls:[
      {id:generateId(),question:"Where should we have dinner on Day 2?",options:["Indian restaurant","Italian place","Street food"],votes:{"Indian restaurant":2,"Italian place":1,"Street food":0},createdBy:"Sanjug"}
    ],
    // ---- NEW FIELDS ----
    bookings:[],
    documents:{passports:[],insurance:{},emergencyContacts:[],medicalNotes:""},
    tasks:[],
    budgetTargets:{Food:5000,Transport:3000,Stay:20000,Activities:4000,Shopping:3000,Misc:2000},
    tripCurrency:"INR",
    destinationCity:"Mumbai",
    savedTemplates:[]
  });

  // ---- auth init ----
  React.useEffect(()=>{
    const saved = localStorage.getItem("trip_auth");
    if(saved) setAuthUser(JSON.parse(saved));
    else setLoading(false);
  },[]);

  // ---- firestore listener ----
  React.useEffect(()=>{
    if(!authUser) return;
    const docRef = db.collection("trips").doc(TRIP_ID);
    let unsub = null;
    const init = async()=>{
      try{
        const doc = await docRef.get();
        if(!doc.exists) await docRef.set(getDefaultTripData());
      }catch(err){ console.error(err); }
      finally{
        unsub = docRef.onSnapshot(snap=>{
          if(snap.exists) setTripData(snap.data());
          setLoading(false);
        }, err=>{ console.error(err); setLoading(false); });
      }
    };
    init();
    return ()=> unsub&&unsub();
  },[authUser]);

  // ---- currency fetch ----
  React.useEffect(()=>{
    if(!tripData) return;
    const cur = tripData.tripCurrency||"INR";
    if(cur==="INR"){ setExchangeRate(1); return; }
    fetch(`https://api.frankfurter.app/latest?from=INR&to=${cur}`)
      .then(r=>r.json())
      .then(data=>{ if(data.rates?.[cur]) setExchangeRate(data.rates[cur]); })
      .catch(()=>{});
  },[tripData?.tripCurrency]);

  // ---- weather fetch ----
  React.useEffect(()=>{
    if(!tripData) return;
    const city = tripData.destinationCity||"Mumbai";
    setWeatherLoading(true);
    setWeather(null);
    fetch(`https://wttr.in/${encodeURIComponent(city)}?format=j1`)
      .then(r=>r.json())
      .then(data=>setWeather(data))
      .catch(()=>{})
      .finally(()=>setWeatherLoading(false));
  },[tripData?.destinationCity]);

  const updateTripData = async newData=>{
    setIsSyncing(true);
    try{ await db.collection("trips").doc(TRIP_ID).set(newData); }
    catch(err){ console.error(err); alert("Save failed. Check connection."); }
    finally{ setIsSyncing(false); }
  };

  const handleLogout = ()=>{ localStorage.removeItem("trip_auth"); setAuthUser(null); setTripData(null); setLoading(false); };

  // ---- loading screens ----
  if(loading) return(
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#0f172a,#1e1b4b)",display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div className="loading-spinner" style={{width:"40px",height:"40px"}}></div>
    </div>
  );
  if(!authUser) return <LoginPage onLogin={u=>{ setAuthUser(u); setLoading(true); }} />;
  if(!tripData) return(
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#0f172a,#1e1b4b)",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:"12px"}}>
      <div className="loading-spinner" style={{width:"40px",height:"40px"}}></div>
      <div style={{color:"#94a3b8",fontSize:"14px"}}>Loading trip data…</div>

  const memberNames  = (tripData.members||[]).map(m=>m.name);

  const currentDay   = DAYS.find(d=>d.id===activeDay);
  const tripCurrency = tripData.tripCurrency||"INR";
  const curSym       = CURRENCY_SYMBOLS[tripCurrency]||tripCurrency;

  // ---- currency formatter ----
  const formatAmt = amtINR => {
    if(!amtINR && amtINR!==0) return "—";
    if(tripCurrency==="INR") return `₹${fmt(amtINR)}`;
    const conv = amtINR * (exchangeRate||1);
    return `${curSym}${fmtD(conv)} (₹${fmt(amtINR)})`;
  };

  // ---- reminders ----
  const getReminders = ()=>{
    const list=[];
    const today = new Date().toISOString().slice(0,10);
    const tomorrow = new Date(Date.now()+86400000).toISOString().slice(0,10);
    (tripData.bookings||[]).forEach(b=>{
      if(b.date>=today&&b.date<=tomorrow&&b.status!=="cancelled")
        list.push({icon:"📅",msg:`Booking: ${b.title} on ${b.date}`});
    });
    (tripData.tasks||[]).filter(t=>t.dueDate===today&&t.status!=="done").forEach(t=>{
      list.push({icon:"✅",msg:`Task due today: ${t.title}`});
    });
    if(expenseSummary.settlements.length>0){
      const twoDaysAgo = new Date(Date.now()-2*86400000).toISOString().slice(0,10);
      const oldUnsettled = (tripData.expenses||[]).filter(e=>e.date<=twoDaysAgo);
      if(oldUnsettled.length>0) list.push({icon:"💰",msg:`${expenseSummary.settlements.length} pending settlement(s)`});
    }
    (tripData.polls||[]).forEach(p=>{
      const total=Object.values(p.votes||{}).reduce((a,b)=>a+b,0);
      if(total===0) list.push({icon:"📊",msg:`Poll needs votes: "${p.question.slice(0,40)}…"`});
    });
    return list;
  };
  const reminders = getReminders();

  // ========== MODAL HELPERS ==========
  const openModal = (type,init={})=>{ setEditForm(init); setModal({type}); };
  const closeModal = ()=>{ setModal(null); setEditForm({}); };
  const setField = (key,val)=>setEditForm(prev=>({...prev,[key]:val}));

  // ========== HANDLERS — EXISTING ==========
  const saveExpense = ()=>{
    const {_editId,date,description,amount,paidBy,splitAmong,category} = editForm;
    if(!description||!amount||!paidBy||!splitAmong||splitAmong.length===0){ alert("Fill all fields."); return; }
    const record = {id:_editId||generateId(),date:date||DAYS[0].date,description,amount:parseFloat(amount),paidBy,splitAmong,category:category||"Misc"};
    const expenses = _editId ? (tripData.expenses||[]).map(e=>e.id===_editId?record:e) : [...(tripData.expenses||[]),record];
    updateTripData({...tripData,expenses});
    closeModal();
  };
  const deleteExpense = id=>updateTripData({...tripData,expenses:(tripData.expenses||[]).filter(e=>e.id!==id)});

  const saveActivity = ()=>{
    const {_editId,_dayId,time,title,location,notes} = editForm;
    if(!title){ alert("Enter activity title"); return; }
    const record = {id:_editId||generateId(),time:time||"12:00",title,location:location||"",notes:notes||""};
    const updatedItinerary = (tripData.itinerary||[]).map(d=>
      d.dayId===_dayId ? {...d,activities:sortActivities(_editId?d.activities.map(a=>a.id===_editId?record:a):[...d.activities,record])} : d
    );
    updateTripData({...tripData,itinerary:updatedItinerary});
    closeModal();
  };
  const deleteActivity = (dayId,actId)=>{
    const updatedItinerary=(tripData.itinerary||[]).map(d=>d.dayId===dayId?{...d,activities:d.activities.filter(a=>a.id!==actId)}:d);
    updateTripData({...tripData,itinerary:updatedItinerary});
  };

  const savePackingItem = ()=>{
    const {_editId,category,item} = editForm;
    if(!item){ alert("Enter item name"); return; }
    const record = _editId ? {...(tripData.packingList||[]).find(i=>i.id===_editId),category,item} : {id:generateId(),category:category||"Clothing",item,checked:false,assignedTo:null};
    const packingList = _editId ? (tripData.packingList||[]).map(i=>i.id===_editId?record:i) : [...(tripData.packingList||[]),record];
    updateTripData({...tripData,packingList});
    closeModal();
  };
  const deletePackingItem = id=>updateTripData({...tripData,packingList:(tripData.packingList||[]).filter(i=>i.id!==id)});
  const togglePackingItem = id=>{
    const updated=(tripData.packingList||[]).map(i=>i.id===id?{...i,checked:!i.checked}:i);
    updateTripData({...tripData,packingList:updated});
  };

  const savePoll = ()=>{
    const {question,options} = editForm;
    const cleanOpts = (options||[]).filter(o=>o.trim());
    if(!question||cleanOpts.length<2){ alert("Enter question and at least 2 options"); return; }
    const votes={}; cleanOpts.forEach(o=>{votes[o]=0;});
    const poll={id:generateId(),question,options:cleanOpts,votes,createdBy:authUser.username};
    updateTripData({...tripData,polls:[...(tripData.polls||[]),poll]});
    closeModal();
  };
  const deletePoll = id=>updateTripData({...tripData,polls:(tripData.polls||[]).filter(p=>p.id!==id)});
  const votePoll = (pollId,option)=>{
    const updated=(tripData.polls||[]).map(p=>p.id===pollId?{...p,votes:{...p.votes,[option]:(p.votes[option]||0)+1}}:p);
    updateTripData({...tripData,polls:updated});
  };

  const saveMember = ()=>{
    const {name}=editForm;
    if(!name?.trim()){ alert("Enter member name"); return; }
    if((tripData.members||[]).length>=10){ alert("Max 10 members"); return; }
    updateTripData({...tripData,members:[...(tripData.members||[]),{id:generateId(),name:name.trim(),isAdmin:false}]});
    closeModal();
  };
  const deleteMember = id=>{
    if((tripData.members||[]).length<=1){ alert("At least one member required"); return; }
    updateTripData({...tripData,members:(tripData.members||[]).filter(m=>m.id!==id)});
  };

  // ========== HANDLERS — NEW ==========
  // --- Bookings ---
  const saveBooking = ()=>{
    const {_editId,type,title,confirmationNo,date,time,location,cost,cancellationPolicy,status} = editForm;
    if(!title||!date){ alert("Fill title and date"); return; }
    const record = {id:_editId||generateId(),type:type||"Hotel",title,confirmationNo:confirmationNo||"",date,time:time||"",location:location||"",cost:parseFloat(cost)||0,cancellationPolicy:cancellationPolicy||"",status:status||"confirmed"};
    const bookings = [...(_editId?(tripData.bookings||[]).map(b=>b.id===_editId?record:b):[...(tripData.bookings||[]),record])];
    bookings.sort((a,b)=>a.date.localeCompare(b.date));
    updateTripData({...tripData,bookings});
    closeModal();
  };
  const deleteBooking = id=>updateTripData({...tripData,bookings:(tripData.bookings||[]).filter(b=>b.id!==id)});

  // --- Tasks ---
  const saveTask = ()=>{
    const {_editId,title,description,assignedTo,dueDate,status} = editForm;
    if(!title){ alert("Enter task title"); return; }
    const record={id:_editId||generateId(),title,description:description||"",assignedTo:assignedTo||memberNames[0]||"",dueDate:dueDate||"",status:status||"pending",createdBy:authUser.username};
    const tasks = _editId?(tripData.tasks||[]).map(t=>t.id===_editId?record:t):[...(tripData.tasks||[]),record];
    updateTripData({...tripData,tasks});
    closeModal();
  };
  const deleteTask = id=>updateTripData({...tripData,tasks:(tripData.tasks||[]).filter(t=>t.id!==id)});
  const updateTaskStatus = (id,status)=>{
    const tasks=(tripData.tasks||[]).map(t=>t.id===id?{...t,status}:t);
    updateTripData({...tripData,tasks});
  };

  // --- Documents ---
  const savePassport = ()=>{
    const {_editId,memberName,passportNo,expiry,nationality} = editForm;
    if(!memberName||!passportNo){ alert("Fill required fields"); return; }
    const record={id:_editId||generateId(),memberName,passportNo,expiry:expiry||"",nationality:nationality||""};
    const docs=tripData.documents||{};
    const passports=_editId?(docs.passports||[]).map(p=>p.id===_editId?record:p):[...(docs.passports||[]),record];
    updateTripData({...tripData,documents:{...docs,passports}});
    closeModal();
  };
  const deletePassport = id=>{
    const docs=tripData.documents||{};
    updateTripData({...tripData,documents:{...docs,passports:(docs.passports||[]).filter(p=>p.id!==id)}});
  };

  const saveEmContact = ()=>{
    const {_editId,name,relationship,phone} = editForm;
    if(!name||!phone){ alert("Fill required fields"); return; }
    const record={id:_editId||generateId(),name,relationship:relationship||"",phone};
    const docs=tripData.documents||{};
    const emergencyContacts=_editId?(docs.emergencyContacts||[]).map(c=>c.id===_editId?record:c):[...(docs.emergencyContacts||[]),record];
    updateTripData({...tripData,documents:{...docs,emergencyContacts}});
    closeModal();
  };
  const deleteEmContact = id=>{
    const docs=tripData.documents||{};
    updateTripData({...tripData,documents:{...docs,emergencyContacts:(docs.emergencyContacts||[]).filter(c=>c.id!==id)}});
  };

  const saveInsurance = ()=>{
    const {provider,policyNumber,emergencyPhone,coverageDetails} = editForm;
    const docs=tripData.documents||{};
    updateTripData({...tripData,documents:{...docs,insurance:{provider:provider||"",policyNumber:policyNumber||"",emergencyPhone:emergencyPhone||"",coverageDetails:coverageDetails||""}}});
    closeModal();
  };

  const saveMedicalNotes = notes=>{
    const docs=tripData.documents||{};
    updateTripData({...tripData,documents:{...docs,medicalNotes:notes}});
  };

  // --- Budget targets ---
  const commitBudgetTargets = ()=>{
    const targets={};
    EXPENSE_CATEGORIES.forEach(cat=>{ targets[cat]=parseFloat(budgetDraft[cat])||0; });
    updateTripData({...tripData,budgetTargets:targets});
    setBudgetEditMode(false);
  };

  // --- Templates ---
  const saveAsTemplate = ()=>{
    const {templateName} = editForm;
    if(!templateName?.trim()){ alert("Enter template name"); return; }
    const template={id:generateId(),name:templateName.trim(),packingList:(tripData.packingList||[]).map(i=>({...i,id:generateId(),checked:false})),budgetTargets:tripData.budgetTargets||{}};
    updateTripData({...tripData,savedTemplates:[...(tripData.savedTemplates||[]),template]});
    closeModal();
  };
  const loadTemplate = tId=>{
    const t=(tripData.savedTemplates||[]).find(x=>x.id===tId);
    if(!t) return;
    if(window.confirm(`Load template "${t.name}"? Packing list & budget targets will be replaced.`))
      updateTripData({...tripData,packingList:t.packingList,budgetTargets:t.budgetTargets});
  };
  const deleteTemplate = id=>updateTripData({...tripData,savedTemplates:(tripData.savedTemplates||[]).filter(t=>t.id!==id)});

  // --- PDF Export ---
  const exportPDF = type=>{
    let html="";
    const baseStyle=`font-family:Arial,sans-serif;padding:24px;color:#111;`;
    const h1=`font-size:24px;margin-bottom:16px;`;
    const h2=`font-size:18px;margin:16px 0 8px;border-bottom:2px solid #eee;padding-bottom:4px;`;

    if(type==="itinerary"){
      html=`<div style="${baseStyle}"><h1 style="${h1}">✈️ Trip Itinerary — May 17–26 2026</h1>
      ${DAYS.map(day=>{
        const dayData=(tripData.itinerary||[]).find(d=>d.dayId===day.id);
        const acts=sortActivities(dayData?.activities||[]);
        return `<div style="margin-bottom:20px"><h2 style="${h2}">${day.label} · ${day.date}</h2>
        ${acts.length===0?"<p style='color:#888'>No activities</p>":acts.map(a=>`<div style="margin:8px 0;padding:8px;background:#f9f9f9;border-radius:4px">
          <strong>${a.time}</strong> — ${a.title}${a.location?` @ ${a.location}`:""}
          ${a.notes?`<br><em style="color:#555;font-size:13px">${a.notes}</em>`:""}
        </div>`).join("")}</div>`;
      }).join("")}</div>`;
    } else if(type==="packing"){
      const packed=(tripData.packingList||[]).filter(i=>i.checked).length;
      const total=(tripData.packingList||[]).length;
      html=`<div style="${baseStyle}"><h1 style="${h1}">🎒 Packing Checklist — ${packed}/${total} packed</h1>
      ${PACKING_CATEGORIES.map(cat=>{
        const items=(tripData.packingList||[]).filter(i=>i.category===cat);
        if(!items.length) return "";
        return `<div style="margin-bottom:16px"><h2 style="${h2}">${cat}</h2>
        ${items.map(i=>`<div style="margin:4px 0">${i.checked?"☑":"☐"} ${i.item}</div>`).join("")}</div>`;
      }).join("")}</div>`;
    } else if(type==="expenses"){
      html=`<div style="${baseStyle}"><h1 style="${h1}">💰 Expense Report</h1>
      <p><strong>Total Spent:</strong> ₹${fmt(expenseSummary.totalSpent)} &nbsp; <strong>Avg/Person:</strong> ₹${fmt(expenseSummary.avgPerPerson)}</p>
      <h2 style="${h2}">All Expenses</h2>
      ${(tripData.expenses||[]).map(e=>`<div style="margin:8px 0;padding:8px;background:#f9f9f9;border-radius:4px;border-left:3px solid #3b82f6">
        <strong>${e.description}</strong> — ₹${fmt(e.amount)}<br>
        <small>${e.date} · Category: ${e.category||"Misc"} · Paid by: ${e.paidBy} · Split: ${(e.splitAmong||[]).join(", ")}</small>
      </div>`).join("")}
      <h2 style="${h2}">Settlement Plan</h2>
      ${expenseSummary.settlements.length===0?"<p>All settled!</p>":expenseSummary.settlements.map(s=>`<div style="margin:6px 0;padding:8px;background:#fff3cd;border-radius:4px">
        <strong>${s.from}</strong> → pays ₹${fmt(s.amount)} → <strong>${s.to}</strong>
      </div>`).join("")}</div>`;
    }

    const el=document.createElement("div");
    el.innerHTML=html;
    el.style.position="fixed"; el.style.left="-9999px"; el.style.top="0";
    document.body.appendChild(el);
    html2pdf().set({margin:10,filename:`trip-${type}.pdf`,jsPDF:{unit:"mm",format:"a4",orientation:"portrait"}}).from(el).save().then(()=>document.body.removeChild(el));
  };

  const resetToDefault = ()=>{
    if(window.confirm("Reset ALL trip data to defaults? Cannot be undone.")) updateTripData(getDefaultTripData());
  };

  // ========== SUB-COMPONENTS ==========
  const SyncBanner = ()=>isSyncing?<div style={{textAlign:"center",fontSize:"12px",color:"#3b82f6",padding:"4px",background:"rgba(59,130,246,0.1)",borderRadius:"6px",marginBottom:"8px"}}>⏳ Syncing…</div>:null;

  const WeatherWidget = ()=>{
    if(weatherLoading) return <div className="section-card" style={{textAlign:"center",padding:"24px",color:"#94a3b8"}}>⛅ Loading weather…</div>;
    if(!weather) return null;
    const cur = weather.current_condition?.[0];
    if(!cur) return null;
    const tempC = parseInt(cur.temp_C);
    const desc  = cur.weatherDesc?.[0]?.value||"";
    const humidity = cur.humidity;
    const windKph  = cur.windspeedKmph;
    const forecast = (weather.weather||[]).slice(0,3);
    const weatherIcons = {"Clear":"☀️","Mainly Clear":"🌤️","Partly Cloudy":"⛅","Overcast":"☁️","Foggy":"🌫️","Light Rain":"🌦️","Rain":"🌧️","Heavy Rain":"⛈️","Thunderstorm":"⛈️","Light Snow":"🌨️","Snow":"❄️","Light Drizzle":"🌦️","Drizzle":"🌧️","Rain Showers":"🌦️","Heavy Showers":"⛈️"};
    const icon = weatherIcons[desc]||"🌡️";

    return(
      <div style={{background:"linear-gradient(135deg,#1e3a5f 0%,#1e293b 100%)",borderRadius:"12px",padding:"16px",border:"1px solid #1e4a7a"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"12px"}}>
          <div>
            <div style={{fontSize:"13px",color:"#94a3b8",marginBottom:"4px"}}>📍 {tripData.destinationCity||"Mumbai"}</div>
            <div style={{fontSize:"40px",lineHeight:1}}>{icon}</div>
            <div style={{fontSize:"32px",fontWeight:"bold",color:"white",marginTop:"4px"}}>{tempC}°C</div>
            <div style={{color:"#94a3b8",fontSize:"13px"}}>{desc}</div>
          </div>
          <div style={{textAlign:"right",fontSize:"12px",color:"#64748b"}}>
            <div>💧 {humidity}%</div>
            <div>🌬️ {windKph} km/h</div>
          </div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"8px"}}>
          {forecast.map((day,i)=>{
            const wCode = parseInt(day.hourly?.[4]?.weathercode||0);
            const desc2 = WMO_CODES[wCode]||"";
            const fIcon = weatherIcons[desc2]||"🌡️";
            return(
              <div key={i} style={{background:"rgba(255,255,255,0.06)",borderRadius:"8px",padding:"8px",textAlign:"center"}}>
                <div style={{fontSize:"11px",color:"#94a3b8"}}>{day.date?.slice(5)||""}</div>
                <div style={{fontSize:"20px",margin:"4px 0"}}>{fIcon}</div>
                <div style={{fontSize:"13px",fontWeight:"bold",color:"white"}}>{day.maxtempC}°</div>
                <div style={{fontSize:"11px",color:"#64748b"}}>{day.mintempC}°</div>
              </div>
            );
          })}
        </div>
      </div>
    );
  };

  const CountdownWidget = ()=>{
    const tripStart = new Date("2026-05-17"); tripStart.setHours(0,0,0,0);
    const tripEnd   = new Date("2026-05-26"); tripEnd.setHours(23,59,59,999);
    const now       = new Date(); now.setHours(0,0,0,0);
    const daysToStart = Math.ceil((tripStart-now)/86400000);
    const daysToEnd   = Math.ceil((tripEnd-now)/86400000);
    let label,color,sub;
    if(daysToStart>0){ label=`Trip starts in ${daysToStart} day${daysToStart!==1?"s":""}!`; color="#3b82f6"; sub="May 17 – 26, 2026"; }
    else if(daysToEnd>=0){ const dayNum=Math.min(10,11-daysToEnd); label=`Day ${dayNum} of 10 — Trip in progress!`; color="#10b981"; sub=`${daysToEnd} day${daysToEnd!==1?"s":""} remaining`; }
    else { label="Trip has ended"; color="#64748b"; sub="May 17 – 26, 2026"; }
    return(
      <div style={{background:"#1e293b",borderRadius:"12px",padding:"16px 20px",border:`1px solid ${color}44`,textAlign:"center"}}>
        <div style={{fontSize:"22px",fontWeight:"bold",color}}>{label}</div>
        <div style={{fontSize:"12px",color:"#64748b",marginTop:"4px"}}>{sub}</div>
      </div>
    );
  };

  const RemindersDropdown = ()=>(
    <div className="reminder-dropdown" onClick={e=>e.stopPropagation()}>
      <div style={{padding:"12px 16px",borderBottom:"1px solid #334155",fontWeight:"600",fontSize:"14px"}}>🔔 Reminders ({reminders.length})</div>
      {reminders.length===0
        ? <div style={{padding:"16px",color:"#64748b",textAlign:"center",fontSize:"13px"}}>All clear! No pending items.</div>
        : reminders.map((r,i)=>(
          <div key={i} style={{padding:"10px 16px",borderBottom:"1px solid #1e293b",display:"flex",gap:"10px",alignItems:"flex-start"}}>
            <span style={{fontSize:"18px"}}>{r.icon}</span>
            <span style={{fontSize:"13px",color:"#cbd5e1"}}>{r.msg}</span>
          </div>
        ))
      }
    </div>
  );

  // ========== RENDER — DASHBOARD (Trip HQ) ==========
  const renderDashboard = ()=>{
    const packedItems  = (tripData.packingList||[]).filter(i=>i.checked).length;
    const totalItems   = (tripData.packingList||[]).length;
    const packPct      = totalItems>0?Math.round((packedItems/totalItems)*100):0;
    const todayStr     = new Date().toISOString().slice(0,10);
    const todayDayData = (tripData.itinerary||[]).find(d=>d.date===todayStr);
    const todayActs    = todayDayData ? sortActivities(todayDayData.activities||[]) : [];
    const pendingTasks = (tripData.tasks||[]).filter(t=>t.assignedTo===authUser.username&&t.status!=="done");
    const myTasks      = pendingTasks.slice(0,3);
    const upcomingBookings = (tripData.bookings||[]).filter(b=>b.date>=todayStr&&b.status!=="cancelled").slice(0,3);

    return(
      <div style={{display:"flex",flexDirection:"column",gap:"20px"}}>
        <SyncBanner />
        <CountdownWidget />

        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:"12px"}}>
          {[
            {label:"Members",    value:(tripData.members||[]).length,      color:"#3b82f6"},
            {label:"Total Spent",value:formatAmt(expenseSummary.totalSpent),color:"#10b981"},
            {label:"Avg/Person", value:formatAmt(expenseSummary.avgPerPerson),color:"#f59e0b"},
            {label:"Packed",     value:`${packedItems}/${totalItems}`,     color:"#a78bfa"}
          ].map(c=>(
            <div key={c.label} className="stat-card">
              <div style={{fontSize:"20px",fontWeight:"bold",color:c.color,wordBreak:"break-word"}}>{c.value}</div>
              <div style={{fontSize:"12px",color:"#94a3b8",marginTop:"4px"}}>{c.label}</div>
            </div>
          ))}
        </div>

        <WeatherWidget />

        {/* Today's Agenda */}
        <div className="section-card">
          <h3 style={{fontWeight:"600",marginBottom:"12px"}}>📅 Today's Agenda {todayActs.length===0&&<span style={{fontSize:"12px",color:"#64748b",fontWeight:"normal"}}>(No trip activities today)</span>}</h3>
          {todayActs.length===0
            ? <div style={{color:"#64748b",fontSize:"13px"}}>Enjoy your day! Check the Itinerary tab to plan activities.</div>
            : todayActs.map((act,i)=>(
              <div key={i} style={{display:"flex",alignItems:"center",gap:"12px",borderBottom:"1px solid #334155",padding:"8px 0"}}>
                <span style={{color:"#3b82f6",fontSize:"12px",fontFamily:"monospace",minWidth:"48px"}}>{act.time}</span>
                <span style={{flex:1}}>{act.title}</span>
                {act.location&&<span style={{fontSize:"11px",color:"#94a3b8"}}>{act.location}</span>}
              </div>
            ))
          }
        </div>

        {/* Upcoming Bookings */}
        {upcomingBookings.length>0&&(
          <div className="section-card">
            <h3 style={{fontWeight:"600",marginBottom:"12px"}}>📋 Upcoming Bookings</h3>
            {upcomingBookings.map(b=>(
              <div key={b.id} style={{display:"flex",alignItems:"center",gap:"12px",borderBottom:"1px solid #334155",padding:"8px 0"}}>
                <span style={{fontSize:"18px"}}>{b.type==="Flight"?"✈️":b.type==="Hotel"?"🏨":b.type==="Train"?"🚂":b.type==="Cab"?"🚕":"📌"}</span>
                <div style={{flex:1}}>
                  <div style={{fontWeight:"500"}}>{b.title}</div>
                  <div style={{fontSize:"11px",color:"#94a3b8"}}>{b.date} {b.time&&`· ${b.time}`}</div>
                </div>
                <span className={`pill pill-${b.status==="confirmed"?"green":b.status==="pending"?"yellow":"red"}`}>{b.status}</span>
              </div>
            ))}
          </div>
        )}

        {/* My Tasks */}
        {myTasks.length>0&&(
          <div className="section-card" style={{border:"1px solid #3b82f655"}}>
            <h3 style={{fontWeight:"600",marginBottom:"12px",color:"#3b82f6"}}>✅ My Pending Tasks ({pendingTasks.length})</h3>
            {myTasks.map(t=>(
              <div key={t.id} style={{display:"flex",alignItems:"center",gap:"10px",borderBottom:"1px solid #334155",padding:"8px 0"}}>
                <button onClick={()=>updateTaskStatus(t.id,"done")} style={{background:"none",border:"1px solid #334155",borderRadius:"4px",color:"#64748b",padding:"2px 8px",fontSize:"11px",cursor:"pointer"}}>Done</button>
                <span style={{flex:1,fontSize:"14px"}}>{t.title}</span>
                {t.dueDate&&<span style={{fontSize:"11px",color:"#f59e0b"}}>📅 {t.dueDate}</span>}
              </div>
            ))}
          </div>
        )}

        {/* Balance Summary */}
        <div className="section-card">
          <h3 style={{fontWeight:"600",marginBottom:"12px"}}>💰 Balance Summary</h3>
          {(tripData.members||[]).map(m=>{
            const bal=expenseSummary.balance[m.name]||0;
            return(
              <div key={m.id} style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:"1px solid #334155"}}>
                <span>{m.name}{m.isAdmin&&<span style={{fontSize:"10px",color:"#f59e0b",marginLeft:"4px"}}>(Admin)</span>}</span>
                <span style={{color:bal>0.01?"#10b981":bal<-0.01?"#ef4444":"#94a3b8",fontWeight:"600"}}>
                  {bal>0.01?`+${formatAmt(bal)}`:bal<-0.01?`-${formatAmt(Math.abs(bal))}`:"Settled ✓"}
                </span>
              </div>
            );
          })}
        </div>

  // ========== RENDER — PACKING (existing, unchanged) ==========

      <div style={{display:"flex",flexDirection:"column",gap:"16px"}}>

          <div className="progress-bar-wrap">
            <div className="progress-bar-fill" style={{width:`${pct}%`,background:"linear-gradient(90deg,#3b82f6,#a78bfa)"}}></div>

              <div key={cat} style={{marginBottom:"14px"}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:"4px",fontSize:"13px"}}>

                    {formatAmt(spent)}

                </div>

              <span style={{fontWeight:"600"}}>{formatAmt(expenseSummary.paidByUser[m.name]||0)}</span>

              <div key={i} style={{padding:"8px 0",borderBottom:"1px solid #334155",fontSize:"14px"}}>
                <span style={{color:"#ef4444",fontWeight:"500"}}>{s.from}</span>

                <span style={{color:"#10b981",fontWeight:"700"}}>{formatAmt(s.amount)}</span>
                <span style={{color:"#64748b"}}> → </span>

              </div>

        </div>
        {(tripData.expenses||[]).length===0&&<div style={{textAlign:"center",padding:"30px",color:"#64748b"}}>No expenses yet</div>}

                <span style={{marginLeft:"8px",fontSize:"11px",background:"rgba(59,130,246,0.15)",color:"#3b82f6",padding:"2px 6px",borderRadius:"4px"}}>{exp.category||"Misc"}</span>

              </div>
            </div>
          </div>

  // ========== RENDER — POLLS (existing, unchanged) ==========
  const renderPolls = ()=>(
    <div style={{display:"flex",flexDirection:"column",gap:"16px"}}>
      <SyncBanner />
      {isAdmin&&<button onClick={()=>openModal("poll",{question:"",options:["",""]})} style={{padding:"10px",background:"#3b82f6",border:"none",borderRadius:"8px",color:"white",fontWeight:"500"}}>+ Create Poll</button>}
      {(!tripData.polls||tripData.polls.length===0)
        ? <div style={{textAlign:"center",padding:"40px",color:"#64748b"}}>No polls yet</div>

          const total=Object.values(poll.votes||{}).reduce((a,b)=>a+b,0);
          const winner=(poll.options||[]).reduce((best,opt)=>((poll.votes?.[opt]||0)>(poll.votes?.[best]||0)?opt:best),(poll.options?.[0]||""));
          return(
            <div key={poll.id} className="section-card">
              <h3 style={{fontWeight:"600",marginBottom:"12px"}}>{poll.question}</h3>
              {(poll.options||[]).map(opt=>{
                const votes=poll.votes?.[opt]||0;
                const pct=total>0?(votes/total)*100:0;
                const isWinning=opt===winner&&total>0;
                return(
                  <div key={opt} style={{marginBottom:"12px"}}>
                    <div style={{display:"flex",justifyContent:"space-between",fontSize:"14px",marginBottom:"4px"}}>
                      <span style={{color:isWinning?"#10b981":"inherit",fontWeight:isWinning?"600":"normal"}}>{isWinning&&"🏆 "}{opt}</span>
                      <span style={{color:"#94a3b8"}}>{votes} vote{votes!==1?"s":""} ({Math.round(pct)}%)</span>

                    <div className="progress-bar-wrap" style={{marginBottom:"6px"}}>
                      <div className="progress-bar-fill" style={{width:`${pct}%`,background:isWinning?"#10b981":"#3b82f6"}}></div>

                  </div>

      {(tripData.members||[]).map(m=>(
        <div key={m.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:"#1e293b",borderRadius:"12px",padding:"16px",border:"1px solid #334155"}}>

          </div>
        </div>
      ))}
    </div>

      <div style={{display:"flex",flexDirection:"column",gap:"16px"}}>

            <button key={f} onClick={()=>setBookingFilter(f)}
              style={{padding:"6px 12px",borderRadius:"8px",whiteSpace:"nowrap",border:"none",background:bookingFilter===f?"#3b82f6":"#1e293b",color:bookingFilter===f?"white":"#94a3b8",fontSize:"12px",textTransform:"capitalize"}}>

        {isAdmin&&<button onClick={()=>openModal("booking",{type:"Hotel",title:"",confirmationNo:"",date:DAYS[0].date,time:"",location:"",cost:"",cancellationPolicy:"",status:"confirmed"})}

                <div style={{display:"flex",gap:"12px",alignItems:"flex-start",flex:1}}>

                    <div style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"4px"}}>
                      <span style={{fontWeight:"600",fontSize:"15px"}}>{b.title}</span>
                      <span className={`pill ${STATUS_PILL_CLASS[b.status]||"pill-gray"}`}>{b.status}</span>
                      <span style={{fontSize:"11px",color:"#64748b"}}>{b.type}</span>

    );

    if(modal.type==="poll") return(
      <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.8)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:50,padding:"16px"}} onClick={closeModal}>
        <div style={{background:"#1e293b",borderRadius:"16px",maxWidth:"500px",width:"100%",maxHeight:"90vh",overflow:"auto"}} onClick={e=>e.stopPropagation()}>
          <div style={{padding:"16px",borderBottom:"1px solid #334155",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <h3 style={{fontWeight:"bold"}}>Create Poll</h3>
            <button onClick={closeModal} style={{background:"none",border:"none",color:"white",fontSize:"24px",lineHeight:1}}>&times;</button>
          </div>
          <div style={{padding:"16px",display:"flex",flexDirection:"column",gap:"12px"}}>
            <div><label style={{display:"block",color:"#cbd5e1",fontSize:"13px",marginBottom:"4px"}}>Question</label>
              <input type="text" placeholder="e.g. Where should we have dinner?" value={editForm.question||""} onChange={e=>setField("question",e.target.value)} style={{width:"100%"}} />
            </div>
            <label style={{color:"#cbd5e1",fontSize:"13px"}}>Options</label>
            {(editForm.options||[]).map((opt,idx)=>(
              <div key={idx} style={{display:"flex",gap:"8px"}}>
                <input type="text" placeholder={`Option ${idx+1}`} value={opt} onChange={e=>{ const opts=[...(editForm.options||[])]; opts[idx]=e.target.value; setField("options",opts); }} style={{flex:1}} />
                {idx>=2&&<button onClick={()=>setField("options",(editForm.options||[]).filter((_,i)=>i!==idx))} style={{background:"#ef4444",border:"none",borderRadius:"6px",color:"white",padding:"0 10px"}}>×</button>}
              </div>
            ))}
            <button onClick={()=>setField("options",[...(editForm.options||[]),""])} style={{padding:"8px",background:"#475569",border:"none",borderRadius:"6px",color:"white"}}>+ Add Option</button>
            <button onClick={savePoll} style={{padding:"12px",background:"#3b82f6",border:"none",borderRadius:"8px",color:"white",fontWeight:"600"}}>Create Poll</button>
          </div>
        </div>
      </div>
    );

    return null;
  };

  // ========== TABS ==========
  const tabs=[
    {id:"dashboard", label:"🏠 Home",      render:renderDashboard},
    {id:"itinerary", label:"📅 Itinerary", render:renderItinerary},
    {id:"bookings",  label:"📋 Bookings",  render:renderBookings},
    {id:"packing",   label:"🎒 Packing",   render:renderPacking},
    {id:"expenses",  label:"💰 Expenses",  render:renderExpenses},
    {id:"tasks",     label:"✅ Tasks",     render:renderTasks},
    {id:"documents", label:"🛂 Documents", render:renderDocuments},
    {id:"polls",     label:"📊 Polls",     render:renderPolls},
    {id:"members",   label:"👥 Members",   render:renderMembers},
    {id:"settings",  label:"⚙️ Settings",  render:renderSettings}
  ];

  // ========== LAYOUT ==========
  return(
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#0f172a,#1e1b4b)"}} onClick={()=>showReminders&&setShowReminders(false)}>
      {/* Header */}
      <div style={{position:"sticky",top:0,zIndex:10,background:"rgba(15,23,42,0.95)",backdropFilter:"blur(10px)",borderBottom:"1px solid #334155",padding:"10px 16px"}}>
        <div style={{display:"flex",flexWrap:"wrap",justifyContent:"space-between",alignItems:"center",gap:"8px",maxWidth:"1200px",margin:"0 auto"}}>
          <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
            <div style={{fontSize:"26px"}}>✈️</div>
            <div>
              <h1 style={{fontWeight:"bold",fontSize:"17px",color:"white",lineHeight:"1.2"}}>Trip Planner PRO</h1>
              <div style={{fontSize:"11px",color:"#94a3b8"}}>{authUser.username}{isAdmin?" (Admin)":""} · {isSyncing?"⏳ Syncing":"✅ Synced"}</div>
            </div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
            {/* Reminders Bell */}
            <div className="reminder-btn-wrap" onClick={e=>{e.stopPropagation();setShowReminders(v=>!v);}}>
              <button style={{background:"#1e293b",border:"1px solid #334155",borderRadius:"8px",color:"white",padding:"6px 10px",fontSize:"16px"}}>🔔</button>
              {reminders.length>0&&<div className="reminder-badge">{reminders.length}</div>}
              {showReminders&&<RemindersDropdown />}
            </div>
          </div>
        </div>
        {/* Tab Bar */}
        <div style={{maxWidth:"1200px",margin:"8px auto 0",display:"flex",gap:"4px",overflowX:"auto",paddingBottom:"2px"}}>
          {tabs.map(tab=>(
            <button key={tab.id} onClick={()=>setActiveTab(tab.id)}
              style={{padding:"6px 12px",borderRadius:"8px",fontSize:"12px",whiteSpace:"nowrap",border:"none",background:activeTab===tab.id?"#3b82f6":"transparent",color:activeTab===tab.id?"white":"#94a3b8",fontWeight:activeTab===tab.id?"600":"normal"}}>
              {tab.label}
            </button>
          ))}
        </div>
      </div>

      {/* Content */}
      <div style={{padding:"20px 16px",maxWidth:"1200px",margin:"0 auto"}}>
        {(()=>{ const t=tabs.find(t=>t.id===activeTab); return t?t.render():null; })()}
      </div>

      {renderModal()}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
